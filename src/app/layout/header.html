<div class="navbar bg-base-100/90 backdrop-blur-2xl border-b border-base-content/5 sticky top-0 z-50 transition-colors duration-300 flex justify-center shadow-sm">
  <div class="w-full max-w-7xl px-4 sm:px-6 flex justify-between">
    
    <div class="navbar-start w-auto flex items-center">
      <!-- Mobile Hamburger Button -->
      <button class="btn btn-ghost lg:hidden -ml-2" (click)="toggleMenu()" aria-label="Abrir menú">
        <svg xmlns="http://www.w3.org/2000/svg" class="h-6 w-6" fill="none" viewBox="0 0 24 24" stroke="currentColor"><path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M4 6h16M4 12h8m-8 6h16" /></svg>
      </button>

      <!-- Mobile Menu Overlay -->
      @if (menuOpen()) {
        <div class="fixed inset-0 bg-black/20 backdrop-blur-sm z-40 lg:hidden" (click)="closeMenu()"></div>
        <div class="fixed top-16 left-4 right-4 z-50 lg:hidden">
          <ul class="menu bg-base-100 border border-base-content/10 rounded-2xl w-full p-3 shadow-2xl font-medium text-base-content gap-1">
            <li><a routerLink="/" routerLinkActive="bg-base-200 text-primary" [routerLinkActiveOptions]="{exact: true}" (click)="closeMenu()">Inicio</a></li>
            <li><a routerLink="/portfolio" routerLinkActive="bg-base-200 text-primary" (click)="closeMenu()">Portafolio</a></li>
            <li><a routerLink="/blog" routerLinkActive="bg-base-200 text-primary" (click)="closeMenu()">Blog</a></li>
          </ul>
        </div>
      }

      <a routerLink="/" class="text-xl font-extrabold tracking-tight text-base-content hover:opacity-80 transition-opacity flex items-center gap-2 ml-1 lg:ml-0">
        Rafael Padilla
      </a>
    </div>

    <div class="navbar-center hidden lg:flex">
      <ul class="menu menu-horizontal px-1 font-semibold text-[15px] gap-2 text-base-content">
        <li><a routerLink="/" routerLinkActive="bg-base-content/5 text-primary" [routerLinkActiveOptions]="{exact: true}" class="hover:bg-base-content/5 rounded-xl transition-colors px-5 py-2.5">Inicio</a></li>
        <li><a routerLink="/portfolio" routerLinkActive="bg-base-content/5 text-primary" class="hover:bg-base-content/5 rounded-xl transition-colors px-5 py-2.5">Portafolio</a></li>
        <li><a routerLink="/blog" routerLinkActive="bg-base-content/5 text-primary" class="hover:bg-base-content/5 rounded-xl transition-colors px-5 py-2.5">Blog</a></li>
      </ul>
    </div>
    
    <div class="navbar-end w-auto flex items-center gap-2 sm:gap-4">
      <a href="mailto:rafael09.develop@gmail.com" class="btn btn-sm sm:btn-md btn-neutral rounded-full font-semibold hidden sm:inline-flex px-6">Contacto</a>
      
      <!-- Theme Switcher (Strict Angular Handling) -->
      <label class="swap swap-rotate btn btn-sm sm:btn-md btn-circle btn-ghost text-base-content bg-base-content/5 hover:bg-base-content/10">
        <input type="checkbox" [checked]="isDarkTheme()" (change)="toggleTheme($event)" aria-label="Toggle Theme" />
        
        <!-- sun icon (light mode) -->
        <svg class="swap-off fill-current w-5 h-5" xmlns="http://www.w3.org/2000/svg" viewBox="0 0 24 24"><path d="M5.64,17l-.71.71a1,1,0,0,0,0,1.41,1,1,0,0,0,1.41,0l.71-.71A1,1,0,0,0,5.64,17ZM5,12a1,1,0,0,0-1-1H3a1,1,0,0,0,0,2H4A1,1,0,0,0,5,12Zm7-7a1,1,0,0,0,1-1V3a1,1,0,0,0-2,0V4A1,1,0,0,0,12,5ZM5.64,7.05a1,1,0,0,0,.7.29,1,1,0,0,0,.71-.29,1,1,0,0,0,0-1.41l-.71-.71A1,1,0,0,0,4.93,6.34Zm12,.29a1,1,0,0,0,.7-.29l.71-.71a1,1,0,1,0-1.41-1.41L17,5.64a1,1,0,0,0,0,1.41A1,1,0,0,0,17.66,7.34ZM21,11H20a1,1,0,0,0,0,2h1a1,1,0,0,0,0-2Zm-9,8a1,1,0,0,0-1,1v1a1,1,0,0,0,2,0V20A1,1,0,0,0,12,19ZM18.36,17A1,1,0,0,0,17,18.36l.71.71a1,1,0,0,0,1.41,0,1,1,0,0,0,0-1.41ZM12,6.5A5.5,5.5,0,1,0,17.5,12,5.51,5.51,0,0,0,12,6.5Zm0,9A3.5,3.5,0,1,1,15.5,12,3.5,3.5,0,0,1,12,15.5Z"/></svg>
        
        <!-- moon icon (dark mode) -->
        <svg class="swap-on fill-current w-5 h-5" xmlns="http://www.w3.org/2000/svg" viewBox="0 0 24 24"><path d="M21.64,13a1,1,0,0,0-1.05-.14,8.05,8.05,0,0,1-3.37.73A8.15,8.15,0,0,1,9.08,5.49a8.59,8.59,0,0,1,.25-2A1,1,0,0,0,8,2.36,10.14,10.14,0,1,0,22,14.05,1,1,0,0,0,21.64,13Zm-9.5,6.69A8.14,8.14,0,0,1,7.08,5.22v.27A10.15,10.15,0,0,0,17.22,15.63a9.79,9.79,0,0,0,2.1-.22A8.11,8.11,0,0,1,12.14,19.73Z"/></svg>
        
      </label>
    </div>
    
  </div>
</div>
